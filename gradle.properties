org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
# One JS output file rather than per-module chunks. The app is a single page with
# no route-level code splitting, so whole-program output is both smaller overall
# and simpler to publish: exactly one `app.js` next to `index.html`.
kotlin.js.ir.output.granularity=whole-program
kotlin.mpp.stability.nowarn=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
